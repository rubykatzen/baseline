name: check-github-config
description: Check repository settings against the baseline GitHub configuration.
inputs:
  skip:
    description: JSON array of GitHub repository config checks to skip.
    default: "[]"
runs:
  using: composite
  steps:
    - run: python3 -m pip install pyyaml
      shell: bash
    - run: python3 "${{ github.action_path }}/check.py"
      shell: bash
      env:
        CONFIG_PATH: ${{ github.action_path }}/../../../config/github.yml
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        SKIP: ${{ inputs.skip }}
