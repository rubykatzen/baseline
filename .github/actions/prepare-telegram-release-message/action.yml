name: Prepare Telegram release message
description: Prepare a Telegram message for a published release.
outputs:
  message:
    description: Prepared message.
    value: ${{ steps.prepare.outputs.message }}
runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      env:
        REPOSITORY: ${{ github.repository }}
        TAG_NAME: ${{ github.event.release.tag_name }}
        RELEASE_NAME: ${{ github.event.release.name }}
        RELEASE_URL: ${{ github.event.release.html_url }}
        ACTOR: ${{ github.event.release.author.login }}
      run: python3 "${{ github.action_path }}/prepare.py"
