name: check-precommit
description: Verify .pre-commit-config.yaml baseline hooks match the linters workflow input.
inputs:
  linters:
    description: JSON array of detected linters.
    required: true
runs:
  using: composite
  steps:
    - run: python3 "${{ github.action_path }}/../../../hooks/check-precommit.py"
      shell: bash
      env:
        LINTERS: ${{ inputs.linters }}
