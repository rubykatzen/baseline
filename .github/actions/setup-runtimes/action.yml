name: setup-runtimes
description: >
  Install tools and non-Python runtimes for the requested linters.
  Accepts a JSON array via the `linters` input and installs only
  the dependencies each linter needs (Python packages, Ruby, or standalone binaries).
inputs:
  linters:
    description: >
      JSON array of linters to prepare runtimes for.
      Supported values: yamllint, pymarkdown, ruff, tombi, shellcheck, actionlint, rubocop, erb-lint, herb, pre-commit
    required: true
runs:
  using: composite
  steps:
    - run: python3 -m pip install yamllint
      shell: bash
      if: contains(fromJSON(inputs.linters), 'yamllint')
    - run: python3 -m pip install pymarkdownlnt
      shell: bash
      if: contains(fromJSON(inputs.linters), 'pymarkdown')
    - run: python3 -m pip install ruff
      shell: bash
      if: contains(fromJSON(inputs.linters), 'ruff')
    - run: python3 -m pip install tombi
      shell: bash
      if: contains(fromJSON(inputs.linters), 'tombi')
    - run: python3 -m pip install pyyaml identify
      shell: bash
      if: contains(fromJSON(inputs.linters), 'pre-commit')
    - run: |
        curl -fsSL https://github.com/koalaman/shellcheck/releases/download/stable/shellcheck-stable.linux.x86_64.tar.xz \
          | tar -xJf - shellcheck-stable/shellcheck
        sudo install shellcheck-stable/shellcheck /usr/local/bin/shellcheck
      shell: bash
      if: contains(fromJSON(inputs.linters), 'shellcheck')
    - run: |
        bash <(curl -sL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        sudo install actionlint /usr/local/bin/actionlint
      shell: bash
      if: contains(fromJSON(inputs.linters), 'actionlint')
    - uses: ruby/setup-ruby@v1
      if: >
        contains(fromJSON(inputs.linters), 'rubocop') ||
        contains(fromJSON(inputs.linters), 'erb-lint') ||
        contains(fromJSON(inputs.linters), 'herb')
      with:
        bundler-cache: true
      env:
        BUNDLE_PATH: .bundle
