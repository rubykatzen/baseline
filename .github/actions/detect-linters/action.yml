name: detect-linters
description: Detect applicable baseline linters from tracked repository files.
inputs:
  skip:
    description: JSON array of linters to skip during automatic selection.
    default: "[]"
outputs:
  linters:
    description: JSON array of detected linters.
    value: ${{ steps.detect.outputs.linters }}
runs:
  using: composite
  steps:
    - run: python3 -m pip install pyyaml identify
      shell: bash
    - id: detect
      run: python3 "${{ github.action_path }}/../../../hooks/detect-linters.py"
      shell: bash
      env:
        SKIP: ${{ inputs.skip }}
