name: Publish LinkedIn release (shared)
on:
  workflow_call:
    inputs:
      telegram-chat-id:
        description: Telegram chat ID that receives publish notifications. Omit to skip notifications.
        required: false
        type: string
    secrets:
      linkedin-access-token:
        required: true
      telegram-bot-token:
        description: Telegram bot token. Omit to skip publish notifications.
        required: false
    outputs:
      post-id:
        description: Published LinkedIn post URN.
        value: ${{ jobs.publish.outputs.post-id }}
concurrency:
  group: linkedin-release-${{ github.repository_id }}-${{ github.event.release.id }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false
    runs-on: ubuntu-slim
    permissions: {}
    outputs:
      post-id: ${{ steps.send.outputs.post-id }}
    steps:
      - id: prepare
        uses: $/.github/actions/prepare-linkedin-release-post
      - id: send
        name: Publish
        uses: $/.github/actions/send-linkedin-post
        with:
          message: ${{ steps.prepare.outputs.message }}
          linkedin-access-token: ${{ secrets.linkedin-access-token }}
  notify:
    needs: publish
    if: >-
      always() &&
      inputs.telegram-chat-id != '' &&
      (needs.publish.result == 'success' || needs.publish.result == 'failure')
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - id: check-token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegram-bot-token }}
        run: echo "present=${TELEGRAM_BOT_TOKEN:+true}" >> "$GITHUB_OUTPUT"
      - id: prepare-success
        if: needs.publish.result == 'success' && steps.check-token.outputs.present == 'true'
        uses: $/.github/actions/prepare-telegram-linkedin-message
        with:
          result: success
          post-id: ${{ needs.publish.outputs.post-id }}
      - name: Notify success
        if: needs.publish.result == 'success' && steps.check-token.outputs.present == 'true'
        uses: $/.github/actions/send-telegram-message
        with:
          message: ${{ steps.prepare-success.outputs.message }}
          telegram-bot-token: ${{ secrets.telegram-bot-token }}
          telegram-chat-id: ${{ inputs.telegram-chat-id }}
          parse-mode: MarkdownV2
      - id: prepare-failure
        if: needs.publish.result == 'failure' && steps.check-token.outputs.present == 'true'
        uses: $/.github/actions/prepare-telegram-linkedin-message
        with:
          result: failure
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Notify failure
        if: needs.publish.result == 'failure' && steps.check-token.outputs.present == 'true'
        uses: $/.github/actions/send-telegram-message
        with:
          message: ${{ steps.prepare-failure.outputs.message }}
          telegram-bot-token: ${{ secrets.telegram-bot-token }}
          telegram-chat-id: ${{ inputs.telegram-chat-id }}
          parse-mode: MarkdownV2
