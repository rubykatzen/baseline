name: Embedder (shared)
on:
  workflow_call:
    inputs:
      extra:
        description: JSON array of optional embedder configurations to include.
        type: string
        default: "[]"
      skip:
        description: JSON array of embedded content fragments to skip.
        type: string
        default: "[]"
jobs:
  embedded-content-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/check-embedder
        with:
          extra: ${{ inputs.extra }}
          skip: ${{ inputs.skip }}
