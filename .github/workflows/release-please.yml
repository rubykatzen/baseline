name: Release Please
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      # GITHUB_TOKEN-created pull requests do not trigger required CI workflows.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false
      - name: Publish gem
        run: |
          gem build baseline.gemspec
          gem push rubykatzen-baseline-*.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
      - name: Update floating tags
        env:
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          MAJOR: ${{ needs.release.outputs.major }}
          MINOR: ${{ needs.release.outputs.minor }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          target=$(git rev-list -n 1 "$TAG_NAME")
          for tag in "v$MAJOR" "v$MAJOR.$MINOR"; do
            git tag --force --annotate "$tag" "$target" --message "$tag"
            git push origin "refs/tags/$tag" --force
          done
