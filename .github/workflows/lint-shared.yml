name: Lint (shared)
on:
  workflow_call:
    inputs:
      skip:
        description: JSON array of linters to skip during automatic selection.
        type: string
        default: "[]"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/detect-linters
        id: detect
        with:
          skip: ${{ inputs.skip }}
      - uses: $/.github/actions/setup-runtimes
        with:
          linters: ${{ steps.detect.outputs.linters }}
      - uses: $/.github/actions/check-precommit
        if: contains(fromJSON(steps.detect.outputs.linters), 'pre-commit')
        with:
          linters: ${{ steps.detect.outputs.linters }}
      - uses: $/.github/actions/lint-yamllint
        if: contains(fromJSON(steps.detect.outputs.linters), 'yamllint')
      - uses: $/.github/actions/lint-pymarkdown
        if: contains(fromJSON(steps.detect.outputs.linters), 'pymarkdown')
      - uses: $/.github/actions/lint-ruff
        if: contains(fromJSON(steps.detect.outputs.linters), 'ruff')
      - uses: $/.github/actions/lint-tombi
        if: contains(fromJSON(steps.detect.outputs.linters), 'tombi')
      - uses: $/.github/actions/lint-shellcheck
        if: contains(fromJSON(steps.detect.outputs.linters), 'shellcheck')
      - uses: $/.github/actions/lint-actionlint
        if: contains(fromJSON(steps.detect.outputs.linters), 'actionlint')
      - uses: $/.github/actions/lint-rubocop
        if: contains(fromJSON(steps.detect.outputs.linters), 'rubocop')
      - uses: $/.github/actions/lint-erb-lint
        if: contains(fromJSON(steps.detect.outputs.linters), 'erb-lint')
      - uses: $/.github/actions/lint-herb
        if: contains(fromJSON(steps.detect.outputs.linters), 'herb')
