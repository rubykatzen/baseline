name: Commit
on:
  # Remove pull_request after pull_request_target reaches main. It temporarily
  # lets this bootstrap change validate itself from the pull request branch.
  pull_request:
    types: [opened, reopened, edited, synchronize]
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
jobs:
  pull-request-title:
    uses: ./.github/workflows/commit-shared.yml
