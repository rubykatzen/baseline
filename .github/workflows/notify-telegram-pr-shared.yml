name: Notify Telegram PR (shared)
on:
  workflow_call:
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true
jobs:
  notify:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
      (contains(fromJSON('["opened","ready_for_review","reopened"]'), github.event.action) ||
      (github.event.action == 'closed' && github.event.pull_request.merged == true)))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - id: prepare
        uses: $/.github/actions/prepare-telegram-pr-message
      - name: Send
        if: steps.prepare.outputs.message != ''
        uses: $/.github/actions/send-telegram-message
        with:
          message: ${{ steps.prepare.outputs.message }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          parse-mode: MarkdownV2
