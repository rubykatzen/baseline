name: Notify Telegram issue (shared)
on:
  workflow_call:
    inputs:
      telegram-chat-id:
        description: Telegram chat ID that receives notifications.
        required: true
        type: string
    secrets:
      telegram-bot-token:
        required: true
jobs:
  notify-closed:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - id: prepare
        uses: $/.github/actions/prepare-telegram-issue-message
      - name: Send
        uses: $/.github/actions/send-telegram-message
        with:
          message: ${{ steps.prepare.outputs.message }}
          telegram-bot-token: ${{ secrets.telegram-bot-token }}
          telegram-chat-id: ${{ inputs.telegram-chat-id }}
          parse-mode: MarkdownV2
