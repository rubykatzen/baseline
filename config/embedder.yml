fragments:
  message-prefix:
    path: AGENTS.md
    content: |
      <!-- baseline fragment: message-prefix -->
      ## Message Prefix

      Prefix every user-visible agent message with the agent emoji followed by the
      repository name in square brackets:

      `EMOJI [OWNER/REPO]:`

      Replace `OWNER/REPO` with the current GitHub repository name.

      Use the emoji to identify the agent:

      - `🤖` Codex
      - `🧠` Claude Code
      - `🖊️` Cursor
      - `🧩` unknown or other agent

      This applies to chat replies, PR comments, review comments, issue comments,
      status updates, and any other written communication.
      <!-- /baseline fragment: message-prefix -->
  embedded-fragment-policy:
    path: AGENTS.md
    content: |
      <!-- baseline fragment: embedded-fragment-policy -->
      ## Embedded Fragment Policy

      This repository uses [Baseline](https://github.com/rubykatzen/baseline) to
      verify shared content fragments across repositories.

      Do not change a required fragment only in the consuming repository. Change
      the fragment in `config/embedder.yml` in Baseline, release it, and then update
      the Baseline workflow version in consuming repositories.

      A repository-specific exception must be declared through the `skip` input of
      `embedder-shared.yml`.
      <!-- /baseline fragment: embedded-fragment-policy -->
  embedded-fragments:
    path: README.md
    content: |
      <!-- baseline fragment: embedded-fragments -->
      ## Embedded Fragments

      This repository uses [Baseline](https://github.com/rubykatzen/baseline) to
      verify shared content fragments across repositories. Required fragments are
      defined centrally in `config/embedder.yml`.
      <!-- /baseline fragment: embedded-fragments -->
  dependabot:
    path: .github/dependabot.yml
    content: |
      # baseline fragment: dependabot
      version: 2
      updates:
        - package-ecosystem: github-actions
          directory: /
          labels: []
          schedule:
            interval: daily
            time: "10:00"
            timezone: "Europe/Berlin"
        - package-ecosystem: pre-commit
          directory: /
          labels: []
          schedule:
            interval: daily
            time: "10:00"
            timezone: "Europe/Berlin"
        - package-ecosystem: pip
          directory: /
          labels: []
          schedule:
            interval: daily
            time: "10:00"
            timezone: "Europe/Berlin"
        - package-ecosystem: bundler
          directory: /
          labels: []
          schedule:
            interval: daily
            time: "10:00"
            timezone: "Europe/Berlin"
      # /baseline fragment: dependabot
