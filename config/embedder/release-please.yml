fragments:
  config:
    path: release-please-config.json
    content: |2
        "include-component-in-tag": false,
        "pull-request-title-pattern": "chore: release ${version}",
        "pull-request-header": "This pull request prepares the next release.",
        "pull-request-footer": "[Release Please documentation](https://github.com/googleapis/release-please#release-please)",
  workflow-policy:
    path: .github/workflows/release.yml
    content: |
      on:
        push:
          branches: [main]
      permissions:
        contents: write
        issues: write
        pull-requests: write
  workflow-action:
    path: .github/workflows/release.yml
    content: "uses: googleapis/release-please-action"
  pull-request-title:
    path: .github/workflows/pr.yml
    content: "uses: amannn/action-semantic-pull-request"
